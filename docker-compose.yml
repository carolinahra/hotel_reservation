services:
  db:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: hotel_booking
    ports:
      - "3326:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - app_network
  
  hotels:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: hotels_app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_USER: root
      DB_HOST: db
      DB_PASSWORD: 'rootpassword'
      DB_NAME: hotel_booking
      DB_PORT: 3306
      LOG_PATH: logs/hotel_reservation.log
      GOOGLE_EMAIL: 
      GOOGLE_APP_PASSWORD: 
      SESSION_EXTENSION_MINUTES: 30
    depends_on:
      - db
    networks:
      - app_network
    volumes:
      - ./logs:/logs
    ports:
      - "3000:3000"
    

volumes:
  mariadb_data: 

networks:
  app_network:
    driver: bridge
