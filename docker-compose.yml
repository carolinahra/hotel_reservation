version: "3.9"

services:
  db:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
    ports:
      - "3326:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: 

networks:
  app_network:
    driver: bridge
